<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Library</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Auth gate — hidden after sign-in -->
<div class="auth-overlay" id="auth-overlay" style="display:none">
  <div class="auth-card">
    <div class="auth-logo">Library</div>
    <p class="auth-tagline">Your personal reading list, anywhere.</p>
    <button class="auth-btn" id="auth-sign-in-btn">Sign in</button>
  </div>
</div>

<nav>
  <div class="logo">Library</div>
  <ul class="nav-links">
    <li><a href="index.html" class="active">Reading List</a></li>
    <li><a href="graph.html">Knowledge Graph</a></li>
  </ul>
  <div class="nav-user" id="nav-user"></div>
</nav>

<div class="add-bar">
  <input class="add-url-input" id="add-url" type="url" placeholder="Paste a link to save it…" autocomplete="off" />
  <span class="add-article-status" id="add-status"></span>
</div>

<div class="filters" id="filters"></div>

<div class="article-grid" id="article-grid">
  <div class="empty-state" id="loading-state">
    <div class="loading-dots"><span></span><span></span><span></span></div>
  </div>
</div>

<!-- Detail panel -->
<div class="detail-panel" id="detail-panel">
  <div class="panel-handle"></div>
  <button class="panel-close" id="panel-close">×</button>
  <div class="panel-body" id="panel-body"></div>
</div>

<!-- Share overlay -->
<div class="share-overlay" id="share-overlay">
  <div class="share-panel">
    <div class="share-title" id="share-article-title"></div>
    <div class="share-form">
      <label for="share-email">Send to</label>
      <input type="email" id="share-email" placeholder="their@email.com" autocomplete="off" />
      <input type="text" id="share-note" placeholder="Add a note… (optional)" />
      <div id="share-tagged"></div>
      <button class="share-send" id="share-send-btn">Open in Mail</button>
    </div>
  </div>
</div>

<script>
// ── State ────────────────────────────────────────────────────────
let allArticles = [];
let selectedId   = null;
let shareArticleData = null;
let activeFilters = { status: null, topic: null, person: null };

// ── Auth helpers ──────────────────────────────────────────────────
async function getToken() {
  try { return await window.__clerk?.session?.getToken() ?? null; }
  catch { return null; }
}

async function authFetch(url, options = {}) {
  const token = await getToken();
  return fetch(url, {
    ...options,
    headers: {
      ...(options.headers || {}),
      ...(token ? { 'Authorization': `Bearer ${token}` } : {}),
    },
  });
}

// ── Sync (debounced) ──────────────────────────────────────────────
let syncTimer = null;
function scheduleSync() {
  clearTimeout(syncTimer);
  syncTimer = setTimeout(async () => {
    try {
      await authFetch('/api/sync', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ articles: allArticles }),
      });
    } catch {}
  }, 1500);
}

// ── Date helper ───────────────────────────────────────────────────
function localDate() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

// ── State mutations ───────────────────────────────────────────────
function toggleRead(id) {
  const a = allArticles.find(x => x.id === id);
  if (!a) return;
  if (a.status === 'read') { a.status = 'unread'; a.date_read = null; }
  else { a.status = 'read'; a.date_read = localDate(); }
  scheduleSync();
  buildFilters();
  renderGrid();
  if (selectedId === id) openPanel(id);
}

function setTopics(id, topics) {
  const a = allArticles.find(x => x.id === id);
  if (a) { a.topics = topics; scheduleSync(); }
}

function setTaggedFor(id, names) {
  const a = allArticles.find(x => x.id === id);
  if (a) { a.tagged_for = names; scheduleSync(); }
}

function deleteArticle(id) {
  allArticles = allArticles.filter(a => a.id !== id);
  scheduleSync();
  buildFilters();
  renderGrid();
}

// ── Tag colours ───────────────────────────────────────────────────
const TAG_PALETTE = [
  ['#fde8e0', '#8b3318'],
  ['#e4ecff', '#2a3f8b'],
  ['#fdf3dc', '#7a4d00'],
  ['#e4f5e4', '#1f6b1f'],
  ['#f0e4ff', '#5c2d8b'],
  ['#dcf5f5', '#0f6666'],
  ['#ffe4f2', '#8b1a55'],
  ['#edffd4', '#3a6600'],
];

function tagStyle(name) {
  let h = 0;
  for (let i = 0; i < name.length; i++) h = (h * 31 + name.charCodeAt(i)) >>> 0;
  const [bg, color] = TAG_PALETTE[h % TAG_PALETTE.length];
  return `style="background:${bg};color:${color}"`;
}

function topicTag(t) {
  return `<span class="tag topic" ${tagStyle(t)}>${t}</span>`;
}

// ── Helpers ───────────────────────────────────────────────────────
function formatDate(s) {
  if (!s) return '';
  return new Date(s + 'T00:00:00').toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
}

function getAllTopics(articles) {
  const s = new Set();
  articles.forEach(a => (a.topics || []).forEach(t => s.add(t)));
  return [...s].sort();
}

function getAllPeople(articles) {
  const s = new Set();
  articles.forEach(a => (a.tagged_for || []).forEach(p => s.add(p)));
  return [...s].sort();
}

// ── Filters ───────────────────────────────────────────────────────
function buildFilters() {
  const container = document.getElementById('filters');
  const topics  = getAllTopics(allArticles);
  const people  = getAllPeople(allArticles);
  const nRead   = allArticles.filter(a => a.status === 'read').length;
  const nUnread = allArticles.filter(a => a.status === 'unread').length;

  let h = statusBtn('all','All') + statusBtn('unread','To Read') + statusBtn('read','Read');

  if (topics.length) {
    const activeTopic = activeFilters.topic;
    const label = activeTopic ? activeTopic : 'Topic';
    const activeClass = activeTopic ? ' fdd-active' : '';
    h += `<span class="filter-sep"></span>
    <div class="fdd" id="fdd-topic">
      <button class="fdd-btn${activeClass}" id="fdd-topic-btn">
        ${label} <span class="fdd-arrow">▾</span>
        ${activeTopic ? `<span class="fdd-clear" id="fdd-topic-clear">×</span>` : ''}
      </button>
      <div class="fdd-menu" id="fdd-topic-menu">
        ${topics.map(t => `<button class="fdd-item${t === activeTopic ? ' fdd-item-active' : ''}" data-val="${t}">${t}</button>`).join('')}
      </div>
    </div>`;
  }

  if (people.length) {
    const activePerson = activeFilters.person;
    const label = activePerson ? activePerson : 'For';
    const activeClass = activePerson ? ' fdd-active' : '';
    h += `<span class="filter-sep"></span>
    <div class="fdd" id="fdd-person">
      <button class="fdd-btn${activeClass}" id="fdd-person-btn">
        ${label} <span class="fdd-arrow">▾</span>
        ${activePerson ? `<span class="fdd-clear" id="fdd-person-clear">×</span>` : ''}
      </button>
      <div class="fdd-menu" id="fdd-person-menu">
        ${people.map(p => `<button class="fdd-item${p === activePerson ? ' fdd-item-active' : ''}" data-val="${p}">${p}</button>`).join('')}
      </div>
    </div>`;
  }

  h += `<span class="stats">${nUnread} unread · ${nRead} read</span>`;
  container.innerHTML = h;

  container.querySelectorAll('.filter-btn').forEach(b => {
    b.addEventListener('click', () => {
      const val = b.dataset.value;
      activeFilters.status = val === 'all' ? null : val;
      container.querySelectorAll('.filter-btn').forEach(x => x.classList.remove('active'));
      b.classList.add('active');
      renderGrid();
    });
  });

  ['topic','person'].forEach(type => {
    const btn  = document.getElementById(`fdd-${type}-btn`);
    const menu = document.getElementById(`fdd-${type}-menu`);
    if (!btn || !menu) return;

    btn.addEventListener('click', e => {
      if (e.target.id === `fdd-${type}-clear`) {
        activeFilters[type] = null;
        buildFilters(); renderGrid(); return;
      }
      menu.classList.toggle('fdd-open');
      ['topic','person'].filter(t => t !== type).forEach(t => {
        document.getElementById(`fdd-${t}-menu`)?.classList.remove('fdd-open');
      });
    });

    menu.querySelectorAll('.fdd-item').forEach(item => {
      item.addEventListener('click', () => {
        const val = item.dataset.val;
        activeFilters[type] = activeFilters[type] === val ? null : val;
        menu.classList.remove('fdd-open');
        buildFilters(); renderGrid();
      });
    });
  });

  document.addEventListener('click', e => {
    if (!e.target.closest('.fdd')) {
      document.querySelectorAll('.fdd-menu').forEach(m => m.classList.remove('fdd-open'));
    }
  }, { once: true });
}

function statusBtn(value, label) {
  const active = (value === 'all' && !activeFilters.status) || activeFilters.status === value;
  return `<button class="filter-btn${active ? ' active' : ''}" data-value="${value}">${label}</button>`;
}

// ── Render grid ───────────────────────────────────────────────────
function renderGrid() {
  const grid = document.getElementById('article-grid');
  let filtered = [...allArticles];

  if (activeFilters.status) filtered = filtered.filter(a => a.status === activeFilters.status);
  if (activeFilters.topic)  filtered = filtered.filter(a => (a.topics||[]).includes(activeFilters.topic));
  if (activeFilters.person) filtered = filtered.filter(a => (a.tagged_for||[]).includes(activeFilters.person));

  if (filtered.length === 0) {
    grid.innerHTML = `<div class="empty-state" style="background:#fff;">
      <h2>Nothing here yet.</h2>
      <p>Paste a link above to add your first article.</p>
    </div>`;
    return;
  }

  grid.innerHTML = filtered.map(a => {
    const allTagItems = [
      ...(a.topics||[]).map(t => topicTag(t)),
      ...(a.tagged_for||[]).map(p => `<span class="tag person">${p}</span>`),
    ];
    const visibleTags = allTagItems.slice(0, 3).join('');
    const extra = allTagItems.length > 3 ? `<span class="tag-overflow">+${allTagItems.length - 3}</span>` : '';
    const dateClass = a.status === 'read' ? 'read' : 'unread';
    const dateLabel = a.date_read ? `Read ${formatDate(a.date_read)}` : formatDate(a.date_saved);
    const selected  = a.id === selectedId ? ' selected' : '';

    return `<div class="article-card${selected}" data-id="${a.id}">
      <button class="card-delete" data-id="${a.id}" title="Remove">×</button>
      <div class="card-title">${a.title || a.url}</div>
      ${(a.author||a.source) ? `<div class="card-meta">
        ${a.author ? `<span class="card-meta-author">${a.author}</span>` : ''}
        ${a.author && a.source ? `<span class="card-meta-sep"> · </span>` : ''}
        ${a.source ? `<span class="card-meta-source">${a.source}</span>` : ''}
      </div>` : ''}
      ${(visibleTags||extra) ? `<div class="card-topics">${visibleTags}${extra}</div>` : ''}
      <div class="card-date ${dateClass}">${dateLabel}</div>
    </div>`;
  }).join('');

  grid.querySelectorAll('.article-card').forEach(card => {
    card.addEventListener('click', e => {
      if (e.target.closest('.card-delete')) return;
      openPanel(card.dataset.id);
    });
  });

  grid.querySelectorAll('.card-delete').forEach(btn => {
    btn.addEventListener('click', e => {
      e.stopPropagation();
      deleteArticle(btn.dataset.id);
    });
  });
}

// ── Panel ─────────────────────────────────────────────────────────
function openPanel(id) {
  const a = allArticles.find(x => x.id === id);
  if (!a) return;
  selectedId = id;

  const dateLabel = a.date_read ? `Read ${formatDate(a.date_read)}` : formatDate(a.date_saved);
  const titleEl   = a.url
    ? `<a href="${a.url}" target="_blank" rel="noopener" class="panel-title-link">${a.title || a.url} ↗</a>`
    : `<div class="panel-title-plain">${a.title || '(no title)'}</div>`;

  document.getElementById('panel-body').innerHTML = `
    ${titleEl}
    <div class="panel-meta">
      ${a.author ? `<span class="panel-meta-author">${a.author}</span>` : ''}
      ${a.author && a.source ? `<span class="panel-meta-sep">·</span>` : ''}
      ${a.source ? `<span class="panel-meta-source">${a.source}</span>` : ''}
      ${(a.author||a.source) && dateLabel ? `<span class="panel-meta-sep">·</span>` : ''}
      <span>${dateLabel}</span>
    </div>
    <div class="panel-actions">
      <button class="panel-action-btn" id="panel-read-btn">${a.status === 'read' ? 'Mark unread' : 'Mark as read'}</button>
      <button class="panel-action-btn" id="panel-share-btn">Share</button>
      <button class="panel-action-btn" id="panel-delete-btn" style="color:#c0392b; margin-left:auto;">Delete</button>
    </div>
    <div class="panel-divider"></div>
    ${a.summary ? `<p class="panel-summary">${a.summary}</p>` : ''}
    ${a.notes   ? `<blockquote class="panel-notes">${a.notes}</blockquote>` : ''}
    <div class="panel-divider"></div>
    <div class="panel-edit-section">
      <div class="panel-tag-label">Topics</div>
      <div class="panel-topic-chips" id="ptopic-chips-${id}"></div>
      <div class="panel-tag-row">
        <input class="panel-tag-input" id="ptopic-input-${id}" placeholder="Add a topic…" autocomplete="off" />
        <button class="panel-tag-add" id="ptopic-add-${id}">Add</button>
      </div>
    </div>
    <div class="panel-divider"></div>
    <div class="panel-edit-section">
      <div class="panel-tag-label">Tagged for</div>
      <div class="panel-tag-chips" id="ptag-chips-${id}"></div>
      <div class="panel-tag-row">
        <input class="panel-tag-input" id="ptag-input-${id}" placeholder="Add a name…" autocomplete="off" />
        <button class="panel-tag-add" id="ptag-add-${id}">Add</button>
      </div>
    </div>
  `;

  renderTopicChips(id);
  bindTopicInputs(id);
  renderTagChips(id);
  bindTagInputs(id);

  document.getElementById('panel-read-btn').addEventListener('click', () => toggleRead(id));
  document.getElementById('panel-share-btn').addEventListener('click', () => openShare(id));
  document.getElementById('panel-delete-btn').addEventListener('click', () => { closePanel(); deleteArticle(id); });

  document.getElementById('detail-panel').classList.add('open');
  document.getElementById('article-grid').classList.add('panel-open');
  document.querySelectorAll('.article-card').forEach(c => c.classList.toggle('selected', c.dataset.id === id));
}

function closePanel() {
  document.getElementById('detail-panel').classList.remove('open');
  document.getElementById('article-grid').classList.remove('panel-open');
  document.querySelectorAll('.article-card.selected').forEach(c => c.classList.remove('selected'));
  selectedId = null;
}

document.getElementById('panel-close').addEventListener('click', closePanel);

// ── Topic edit helpers ────────────────────────────────────────────
function renderTopicChips(id) {
  const a = allArticles.find(x => x.id === id);
  const topics = a?.topics || [];
  const el = document.getElementById(`ptopic-chips-${id}`);
  if (!el) return;
  el.innerHTML = topics.map((t, i) => {
    const [bg, color] = TAG_PALETTE[(() => { let h=0; for(let c of t) h=(h*31+c.charCodeAt(0))>>>0; return h; })() % TAG_PALETTE.length];
    return `<span class="panel-tag-chip" style="background:${bg};color:${color}">
      ${t}<button class="panel-topic-remove" data-index="${i}">×</button>
    </span>`;
  }).join('');
  el.querySelectorAll('.panel-topic-remove').forEach(btn => {
    btn.addEventListener('click', () => {
      const a = allArticles.find(x => x.id === id);
      if (!a) return;
      const t = [...(a.topics || [])];
      t.splice(Number(btn.dataset.index), 1);
      setTopics(id, t);
      renderTopicChips(id);
      buildFilters(); renderGrid();
    });
  });
}

function bindTopicInputs(id) {
  function addTopic() {
    const inp = document.getElementById(`ptopic-input-${id}`);
    const name = inp?.value.trim();
    if (!name) return;
    const a = allArticles.find(x => x.id === id);
    const t = [...(a?.topics || [])];
    if (!t.includes(name)) { t.push(name); setTopics(id, t); }
    if (inp) inp.value = '';
    renderTopicChips(id);
    buildFilters(); renderGrid();
  }
  document.getElementById(`ptopic-add-${id}`)?.addEventListener('click', addTopic);
  document.getElementById(`ptopic-input-${id}`)?.addEventListener('keydown', e => {
    if (e.key === 'Enter') { e.preventDefault(); addTopic(); }
  });
}

// ── Tag helpers ───────────────────────────────────────────────────
function renderTagChips(id) {
  const a = allArticles.find(x => x.id === id);
  const names = a?.tagged_for || [];
  const el = document.getElementById(`ptag-chips-${id}`);
  if (!el) return;
  el.innerHTML = names.map((p, i) => `
    <span class="panel-tag-chip">
      ${p}<button class="panel-tag-remove" data-index="${i}">×</button>
    </span>`).join('');
  el.querySelectorAll('.panel-tag-remove').forEach(btn => {
    btn.addEventListener('click', () => {
      const a = allArticles.find(x => x.id === id);
      if (!a) return;
      const n = [...(a.tagged_for || [])];
      n.splice(Number(btn.dataset.index), 1);
      setTaggedFor(id, n);
      renderTagChips(id);
      buildFilters(); renderGrid();
    });
  });
}

function bindTagInputs(id) {
  function addTag() {
    const inp = document.getElementById(`ptag-input-${id}`);
    const name = inp?.value.trim();
    if (!name) return;
    const a = allArticles.find(x => x.id === id);
    const n = [...(a?.tagged_for || [])];
    if (!n.includes(name)) { n.push(name); setTaggedFor(id, n); }
    if (inp) inp.value = '';
    renderTagChips(id);
    buildFilters(); renderGrid();
  }
  document.getElementById(`ptag-add-${id}`)?.addEventListener('click', addTag);
  document.getElementById(`ptag-input-${id}`)?.addEventListener('keydown', e => {
    if (e.key === 'Enter') { e.preventDefault(); addTag(); }
  });
}

// ── Share ─────────────────────────────────────────────────────────
function openShare(id) {
  const a = allArticles.find(x => x.id === id);
  shareArticleData = a || null;
  if (!a) return;
  document.getElementById('share-article-title').textContent = `"${a.title || a.url}"`;
  document.getElementById('share-email').value = '';
  document.getElementById('share-note').value = '';
  const tagged = a.tagged_for || [];
  const el = document.getElementById('share-tagged');
  if (tagged.length) {
    el.innerHTML = `<div class="share-tagged-label">Tagged for</div>` +
      tagged.map(p => `<button class="tagged-quick" data-name="${p}">${p}</button>`).join('');
    el.querySelectorAll('.tagged-quick').forEach(b => {
      b.addEventListener('click', () => {
        document.getElementById('share-email').placeholder = `${b.dataset.name}'s email`;
        document.getElementById('share-email').focus();
      });
    });
  } else { el.innerHTML = ''; }
  document.getElementById('share-overlay').classList.add('visible');
  document.body.style.overflow = 'hidden';
  setTimeout(() => document.getElementById('share-email').focus(), 60);
}

function closeShare() {
  document.getElementById('share-overlay').classList.remove('visible');
  document.body.style.overflow = '';
  shareArticleData = null;
}

document.getElementById('share-overlay').addEventListener('click', e => {
  if (e.target === e.currentTarget) closeShare();
});

document.getElementById('share-send-btn').addEventListener('click', () => {
  if (!shareArticleData) return;
  const email = document.getElementById('share-email').value.trim();
  const note  = document.getElementById('share-note').value.trim();
  const title = shareArticleData.title || shareArticleData.url;
  const parts = [];
  if (note) parts.push(note, '');
  parts.push(title, shareArticleData.url);
  if (shareArticleData.summary) parts.push('', shareArticleData.summary);
  const link = document.createElement('a');
  link.href = `mailto:${email}?subject=${encodeURIComponent(`"${title}"`)}&body=${encodeURIComponent(parts.join('\n'))}`;
  link.style.display = 'none';
  document.body.appendChild(link);
  link.click();
  document.body.removeChild(link);
});

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    if (document.getElementById('share-overlay').classList.contains('visible')) closeShare();
    else closePanel();
  }
});

// ── Add article ───────────────────────────────────────────────────
document.getElementById('add-url').addEventListener('keydown', async e => {
  if (e.key !== 'Enter') return;
  const input  = document.getElementById('add-url');
  const status = document.getElementById('add-status');
  const url = input.value.trim();
  if (!url) return;
  input.disabled = true;
  status.textContent = 'Saving…';
  try {
    const res = await authFetch('/api/add', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ url }),
    });
    if (!res.ok) throw new Error();
    const article = await res.json();
    allArticles.unshift(article);
    input.value = '';
    status.textContent = '';
    buildFilters();
    renderGrid();
  } catch {
    status.textContent = 'Could not fetch that link.';
    setTimeout(() => { status.textContent = ''; }, 3000);
  } finally {
    input.disabled = false;
    input.focus();
  }
});

// ── Clerk init + app bootstrap ────────────────────────────────────
function updateNavUser(user) {
  const name = user.firstName || user.emailAddresses?.[0]?.emailAddress || 'Account';
  document.getElementById('nav-user').innerHTML = `
    <span class="nav-user-name">${name}</span>
    <button class="nav-signout-btn" onclick="window.__clerk.signOut().then(()=>location.reload())">Sign out</button>
  `;
}

async function initApp() {
  try {
    const res = await authFetch('/api/articles');
    if (res.ok) allArticles = await res.json();
  } catch {}
  buildFilters();
  renderGrid();
}

async function init() {
  let publishableKey = '';
  try {
    const cfg = await fetch('/api/config').then(r => r.json());
    publishableKey = cfg.publishableKey || '';
  } catch {}

  if (!publishableKey) {
    // No auth configured — run in single-user mode without sign-in
    initApp();
    return;
  }

  // Derive Clerk JS CDN URL from the publishable key
  let clerkLoaded = false;
  try {
    const parts = publishableKey.split('_');
    const b64   = parts[parts.length - 1];
    const host  = atob(b64).replace(/\$$/, '');
    await new Promise((resolve, reject) => {
      const s = document.createElement('script');
      s.src = `https://${host}/npm/@clerk/clerk-js@latest/dist/clerk.browser.js`;
      s.onload = resolve;
      s.onerror = reject;
      document.head.appendChild(s);
    });
    clerkLoaded = true;
  } catch {
    initApp();
    return;
  }

  const clerk = new window.Clerk(publishableKey);
  await clerk.load();
  window.__clerk = clerk;

  if (!clerk.user) {
    document.getElementById('auth-overlay').style.display = 'flex';
    document.getElementById('auth-sign-in-btn').addEventListener('click', () => clerk.openSignIn());
    clerk.addListener(({ user }) => {
      if (user) {
        document.getElementById('auth-overlay').style.display = 'none';
        updateNavUser(user);
        initApp();
      }
    });
  } else {
    updateNavUser(clerk.user);
    initApp();
  }
}

init();
</script>
